<!DOCTYPE html>
<html>
<head>
  <title>Matrix Inverse Calculator</title>
</head>
<body>

<h2>Matrix Inverse Calculator</h2>

<input id="size" placeholder="Enter size n">
<button onclick="generate()">Create Matrix</button>

<div id="matrix"></div>
<button onclick="compute()">Compute Inverse</button>

<pre id="result"></pre>

<script>
function generate() {
  let n = parseInt(document.getElementById("size").value);
  let container = document.getElementById("matrix");
  container.innerHTML = "";

  for (let i = 0; i < n; i++) {
    let row = document.createElement("div");
    for (let j = 0; j < n; j++) {
      let input = document.createElement("input");
      input.id = `a${i}${j}`;
      input.size = 3;
      row.appendChild(input);
    }
    container.appendChild(row);
  }
}

function compute() {
  let n = parseInt(document.getElementById("size").value);
  let A = [];

  for (let i = 0; i < n; i++) {
    let row = [];
    for (let j = 0; j < n; j++) {
      row.push(parseFloat(document.getElementById(`a${i}${j}`).value));
    }
    A.push(row);
  }

  // Simple Gauss-Jordan inversion
  let I = A.map((row, i) =>
    row.map((_, j) => (i === j ? 1 : 0))
  );

  for (let i = 0; i < n; i++) {
    let factor = A[i][i];
    if (factor === 0) {
      document.getElementById("result").textContent = "Matrix not invertible";
      return;
    }

    for (let j = 0; j < n; j++) {
      A[i][j] /= factor;
      I[i][j] /= factor;
    }

    for (let k = 0; k < n; k++) {
      if (k !== i) {
        let f = A[k][i];
        for (let j = 0; j < n; j++) {
          A[k][j] -= f * A[i][j];
          I[k][j] -= f * I[i][j];
        }
      }
    }
  }

  document.getElementById("result").textContent =
    "Inverse:\n" + JSON.stringify(I, null, 2);
}
</script>

</body>
</html>
